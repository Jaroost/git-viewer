[package]
name = "git-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
dunce = "1.0.5"
eframe = "0.37.0"
git2 = { version = "0.21.0", features = ["cred"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
tempfile = "3.27.0"

# Optimise dependencies even in debug builds: syntax highlighting and egui are
# unusably slow unoptimised, while our own crate still compiles quickly.
[profile.dev.package."*"]
opt-level = 2
